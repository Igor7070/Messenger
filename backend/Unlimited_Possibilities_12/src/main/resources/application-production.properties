spring.application.name=Unlimited_Possibilities_12
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# НЕ create! create удаляет и создаёт заново все таблицы при КАЖДОМ старте
# приложения, а Railway перезапускает его после каждого пуша — то есть каждый
# пуш обнулял продовую базу: пользователей, чаты, сообщения, ключи.
# update создаёт недостающие таблицы и столбцы, но существующие данные не трогает.
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://mysql.railway.internal:3306/railway
spring.datasource.username=root
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Соединения с базой держим наготове. Каждый запрос страницы ждал около
# секунды, хотя сама выборка крошечная: время уходило не на поиск, а на
# установку соединения — поэтому держим несколько открытыми постоянно и
# проверяем их заранее.
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.keepalive-time=120000

# Соединение освобождается сразу после работы, а не висит до конца ответа.
spring.jpa.open-in-view=false
# Запросы в журнал на боевом сервере не пишем: каждая страница
# поднимает десятки запросов, и печать каждого — это и тормоза, и
# журнал, в котором ничего не найти.
spring.jpa.show-sql=false

openai.api.key=${OPENAI_API_KEY}
huggingFace.api.token=${HUGGINGFACE_API_TOKEN}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=https://www.googleapis.com/auth/userinfo.email,https://www.googleapis.com/auth/gmail.send,email,profile
spring.security.oauth2.client.registration.google.redirect-uri=https://unlimitedpossibilities12.org/oauth2/callback
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
# Подробности проверки доступа нужны при разборе полётов, а не
# каждый день: на каждый запрос уходило по десятку строк.
logging.level.org.springframework.security=WARN

telegrambot.name=${TELEGRAMBOT_NAME}
telegrambot.api.token=${TELEGRAMBOT_API_TOKEN}

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Токены доступа к API. AUTH_SECRET задаётся в переменных окружения Railway.
# auth.enforce=false: запросы без токена пропускаются и логируются (AUTH-MISSING);
# после проверки, что оба клиента шлют токен везде, переключить на true.
auth.secret=${AUTH_SECRET:}
auth.enforce=${AUTH_ENFORCE:false}
# Права доступа (self / участник чата): log — только логировать AUTHZ-DENY, enforce — 403
auth.authz=${AUTH_AUTHZ:log}

# Ключ сервисного аккаунта Firebase (JSON целиком). Пусто -> push выключены.
firebase.credentials=${FIREBASE_CREDENTIALS:}
